name: "Link"
guid: "3cf8ee31-4bee-4afa-b838-b8df49dfeb90"
version: "1.0.1.0"
targetAbi: "10.9.0.0"
framework: "net8.0"
owner: "tehsu"
overview: "A plex.tv/link-style device linking page for Jellyfin."
description: >
  Adds a dedicated /link page to your Jellyfin server. Visitors sign in once
  with their server account, then enter the code shown on a TV, phone, or
  other device to link it instantly, no digging through settings menus
  required. Built on top of Jellyfin's existing Quick Connect feature.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Link.dll"
changelog: >
  - 1.0.1.0: Fix "Sign in failed" on servers with legacy authorization
    disabled (the default since Jellyfin 12) by authenticating with the
    standard Authorization: MediaBrowser header instead of the removed
    X-Emby-Authorization/X-Emby-Token headers. Stamp a real assembly
    version so the dashboard's enable/disable and uninstall buttons work
    (the plugin previously reported 0.0.0.0). Also honor a configured
    server base URL.

  - 1.0.0.0: Initial release: standalone /link page, Quick Connect
    authorization, and an admin config page for branding.
