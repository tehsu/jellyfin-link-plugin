name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (e.g. v1.0.0.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Jellyfin keys the enable/disable and uninstall API routes off the
      # version in a plugin's meta.json, but shows the assembly version in the
      # dashboard. If they drift, those buttons 404. meta.json comes from the
      # declared plugin version, so it has to match what gets compiled in.
      - name: Check version consistency
        run: |
          build_version="$(sed -n 's/^version: *"\([0-9.]*\)".*/\1/p' build.yaml | head -1)"
          csproj_version="$(sed -n 's:.*<AssemblyVersion>\([0-9.]*\)</AssemblyVersion>.*:\1:p' Jellyfin.Plugin.Link/Jellyfin.Plugin.Link.csproj | head -1)"
          echo "build.yaml: ${build_version:-<none>} / csproj: ${csproj_version:-<none>}"
          if [ -z "$build_version" ] || [ -z "$csproj_version" ]; then
            echo "::error::Could not read the plugin version from build.yaml or the csproj."
            exit 1
          fi
          if [ "$build_version" != "$csproj_version" ]; then
            echo "::error::build.yaml declares $build_version but the assembly is built as $csproj_version. These must match or the dashboard's enable/disable buttons will 404."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Link.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.Link.sln -c Release --no-restore

      - name: Package
        run: |
          mkdir -p artifacts/Link
          cp Jellyfin.Plugin.Link/bin/Release/net8.0/Jellyfin.Plugin.Link.dll artifacts/Link/
          cd artifacts
          zip -r link.zip Link

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-link
          path: artifacts/link.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Link.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.Link.sln -c Release --no-restore

      - name: Package
        run: |
          mkdir -p artifacts/Link
          cp Jellyfin.Plugin.Link/bin/Release/net8.0/Jellyfin.Plugin.Link.dll artifacts/Link/
          cd artifacts
          zip -r link.zip Link

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/link.zip
          generate_release_notes: true
